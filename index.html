<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070a12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Manganana" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Leia mangás em português: catálogo, capítulos, favoritos e leitura offline." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="msapplication-TileColor" content="#070a12" />
  <title>Manganana — leia mangá em português</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23ffd60a'/><text x='50' y='72' font-size='62' text-anchor='middle' font-family='sans-serif' font-weight='bold' fill='%23070a12'>M</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- SPLASH -->
    <div id="splash" class="splash">
      <div class="splash-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/></svg></div>
      <h1>manga<span>nana</span></h1>
      <p>carregando sua biblioteca…</p>
      <div class="splash-bar"><i></i></div>
    </div>

    <!-- HOME -->
    <section id="view-home" class="view active">
      <header class="topbar">
        <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/></svg><span>manga<span>nana</span></span></div>
        <div class="top-actions">
          <button class="icon-btn" id="btnSettings" title="Configurações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
          <button class="icon-btn avatar-btn" id="btnProfile" title="Perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>
        </div>
      </header>

      <div class="content" id="homeContent">
        <div class="hero-card skeleton" id="heroSkeleton"></div>
        <div class="section-head"><h2>Continue lendo</h2></div>
        <div class="scroll-row" id="continueRow"></div>
        <div class="section-head"><h2>Em alta 🔥</h2><button class="see-all" data-goto="explore">Ver tudo →</button></div>
        <div class="scroll-row" id="trendingRow"></div>
        <div class="section-head"><h2>Recentes 📚</h2><button class="see-all" data-goto="explore">Ver tudo →</button></div>
        <div class="scroll-row" id="recentRow"></div>
      </div>
    </section>

    <!-- EXPLORE -->
    <section id="view-explore" class="view">
      <header class="topbar">
        <div class="brand small"><span>explorar</span></div>
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="searchInput" placeholder="Buscar mangá…" autocomplete="off" />
        </div>
      </header>
      <div class="content">
        <div class="chips" id="genreChips"></div>
        <div class="list-wrap" id="exploreGrid"></div>
        <div class="load-row"><button class="load-btn" id="loadMoreBtn">Carregar mais ↓</button></div>
      </div>
    </section>

    <!-- LIBRARY -->
    <section id="view-library" class="view">
      <header class="topbar"><div class="brand small"><span>biblioteca</span></div></header>
      <div class="content">
        <div class="seg" id="libSeg">
          <button class="seg-btn active" data-lib="favs">Favoritos</button>
          <button class="seg-btn" data-lib="history">Histórico</button>
        </div>
        <div class="grid" id="libraryGrid"></div>
        <div class="empty" id="libraryEmpty" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/></svg>
          <p id="libraryEmptyText">Nada por aqui ainda.</p>
        </div>
      </div>
    </section>

    <!-- PROFILE -->
    <section id="view-profile" class="view">
      <header class="topbar"><div class="brand small"><span>perfil</span></div></header>
      <div class="content">
        <div class="profile-card">
          <div class="avatar big">J</div>
          <h3>Leitor</h3>
          <p class="muted">Leitor do Manganana</p>
        </div>
        <div class="stats-row">
          <div class="stat"><strong id="statFavs">0</strong><span>favoritos</span></div>
          <div class="stat"><strong id="statRead">0</strong><span>lidos</span></div>
          <div class="stat"><strong id="statPages">0</strong><span>páginas</span></div>
        </div>
        <div class="menu-list">
          <button class="menu-item" id="btnClearHistory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Limpar histórico</button>
        </div>
        <div class="section-head" style="margin-top:22px"><h2>Downloads ⬇</h2></div>
        <div id="downloadsWrap"></div>
      </div>
    </section>

    <!-- MANGA DETAIL -->
    <section id="view-detail" class="view detail-view">
      <header class="topbar overlay">
        <button class="icon-btn" id="btnDetailBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
        <div class="brand small"><span id="detailTitleNav">Detalhes</span></div>
        <button class="icon-btn" id="btnDetailFav" title="Favoritar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>
      </header>
      <div class="content" id="detailContent"></div>
    </section>

    <!-- READER -->
    <section id="view-reader" class="view reader-view">
      <header class="reader-top" id="readerTop">
        <button class="icon-btn" id="btnReaderBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
        <div class="reader-title"><span id="readerMangaName">—</span><small id="readerChapterName">—</small></div>
        <button class="icon-btn" id="btnDownloadChapter" title="Baixar capítulo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg></button>
        <button class="icon-btn" id="btnReaderSettings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button>
      </header>
      <div class="reader-body" id="readerBody"></div>
      <div class="reader-nav" id="readerNav">
        <button class="nav-btn" id="prevChapter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Anterior</button>
        <button class="nav-btn primary" id="chapterListBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Capítulos</button>
        <button class="nav-btn" id="nextChapter">Próximo<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
      <!-- chapter sheet -->
      <div class="sheet" id="chapterSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-head"><strong>Capítulos</strong><button class="icon-btn" id="closeSheet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
        <div class="sheet-list" id="chapterSheetList"></div>
      </div>
      <!-- reader settings sheet -->
      <div class="sheet" id="readerSettingsSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-head"><strong>Leitor</strong><button class="icon-btn" id="closeReaderSettings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
        <div class="sheet-body">
          <div class="rs-group">
            <label>Fundo do leitor</label>
            <div class="rs-chips" id="rsBgChips">
              <button class="rs-chip" data-bg="auto">Escuro</button>
              <button class="rs-chip" data-bg="sepia">Sépia</button>
              <button class="rs-chip" data-bg="light">Claro</button>
            </div>
          </div>
          <div class="rs-group">
            <label>Brilho <span id="rsBrightVal">100%</span></label>
            <input type="range" id="rsBright" min="30" max="130" value="100" />
          </div>
          <div class="rs-group">
            <label>Largura da página <span id="rsWidthVal">100%</span></label>
            <input type="range" id="rsWidth" min="50" max="150" value="100" />
          </div>
          <div class="rs-group">
            <label>Modo webtoon (rolagem contínua)</label>
            <div class="rs-toggle"><input type="checkbox" id="rsWebtoon" /><span class="rs-toggle-slider"></span></div>
          </div>
          <div class="rs-group">
            <label>Toque nas bordas para navegar</label>
            <div class="rs-toggle"><input type="checkbox" id="rsTapZones" /><span class="rs-toggle-slider"></span></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item active" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg><span>início</span></button>
    <button class="nav-item" data-tab="explore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36z"/></svg><span>explorar</span></button>
    <button class="nav-item" data-tab="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span>biblioteca</span></button>
    <button class="nav-item" data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>perfil</span></button>
  </nav>

  <!-- CHARACTER MODAL -->
  <div class="sheet" id="charModal">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><strong>Personagem</strong><button class="icon-btn" onclick="closeCharModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="sheet-body" id="charModalBody"></div>
  </div>

  <!-- SETTINGS SHEET -->
  <div class="sheet" id="settingsSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><strong>Configurações</strong><button class="icon-btn" id="closeSettings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="sheet-body">
      <label class="setting-row"><span>Modo leitura</span><select id="setReadingMode"><option value="vertical">Rolagem vertical</option><option value="horizontal">Páginas (horizontal)</option></select></label>
      <label class="setting-row"><span>Qualidade</span><select id="setQuality"><option value="full">Original</option><option value="dataSaver">Economia de dados</option></select></label>
      <label class="setting-row"><span>Ler da direita p/ esquerda</span><div class="switch"><input type="checkbox" id="setRTL" /><i></i></div></label>
      <label class="setting-row"><span>Tema escuro</span><div class="switch"><input type="checkbox" id="setDark" checked /><i></i></div></label>
    </div>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
